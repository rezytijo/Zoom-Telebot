services:
  zoom-telebot:
    # Build from local Dockerfile in docker/ directory
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production

    # Container configuration
    container_name: zoom-telebot-soc
    restart: unless-stopped
    hostname: zoom-telebot

    # Environment variables (load from .env file)
    env_file:
      - .env
    # Port mapping for agent API
    ports:
      - "${AGENT_API_PORT:-8767}:${AGENT_API_PORT:-8767}"
      - "127.0.0.1:${ZOOM_WEBHOOK_PORT:-8081}:8081"

    # Volume mounts for data persistence
    volumes:
      # Data directory (contains database and shortener config)
      - data:/app/data:rw
      # Logs directory
      - logs:/app/logs:rw

    # Networks
    networks:
      - zoom-telebot-network

    # Health check
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

    depends_on:
      zoom-remote:
        condition: service_healthy

  zoom-remote:
    build:
      context: .
      dockerfile: remote/Dockerfile
      args:
        KASM_ZOOM_IMAGE: ${KASM_ZOOM_IMAGE:-kasmweb/zoom:1.18.0}
    container_name: zoom-remote
    restart: unless-stopped
    shm_size: 1gb
    environment:
      - VNC_PW=${ZOOM_REMOTE_VNC_PASSWORD}
      - REMOTE_API_TOKEN=${ZOOM_REMOTE_API_TOKEN}
      - REMOTE_API_PORT=8080
      - REMOTE_ALLOWED_ZOOM_DOMAINS=.zoom.us
      - QTWEBENGINE_DISABLE_SANDBOX=1
    expose:
      - "8080"
      - "6901"
    ports:
      - "127.0.0.1:6901:6901"
      - "127.0.0.1:8080:8080"
    volumes:
      - zoom_remote_profile:/home/kasm-user
    networks:
      - zoom-telebot-network
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# Networks
networks:
  zoom-telebot-network:
    driver: bridge
    name: zoom-telebot-network

# Volumes for data persistence
volumes:
  data:
    driver: local
    name: data
  logs:
    driver: local
    name: logs
  zoom_remote_profile:
    driver: local
    name: zoom_remote_profile
