name: Security Audit and Testing

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit (Dependencies & Code)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Audit Dependencies for Vulnerabilities (pip-audit)
        run: |
          pip-audit -r requirements.txt --desc

      - name: Audit Source Code for Vulnerabilities (Bandit)
        run: |
          bandit -r . -ll -ii -x ./.venv,./tests,./build,./dist

      - name: Dependency Integrity & Malware Check (OSV-Scanner)
        uses: google/osv-scanner-action/bootstrap-action@v1
        with:
          scan-args: |
            --file=requirements.txt

      - name: Check for Outdated Dependencies
        run: |
          echo "=== Outdated Dependencies ==="
          pip install -r requirements.txt
          pip list --outdated --format=columns || true

  run-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          TELEGRAM_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          INITIAL_OWNER_ID: "123456789"
          INITIAL_OWNER_USERNAME: "owner"
          ZOOM_ACCOUNT_ID: "test"
          ZOOM_CLIENT_ID: "test"
          ZOOM_CLIENT_SECRET: "test"
          TINYURL_API_KEY: "test"
        run: |
          python -m pytest tests/ -v
