[pytest]
# auto, not strict: every async test gets the asyncio marker without needing
# @pytest.mark.asyncio on each one. Strict mode silently skips an unmarked
# async test - it does not fail - which is how a suite can go green while
# testing nothing. Given that this repo has already lost coverage to
# silently-uncollected tests, the forgiving default is the wrong one here.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
